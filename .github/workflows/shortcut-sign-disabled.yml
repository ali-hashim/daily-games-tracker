name: Full upload signing (protected Actions automation)

# The filename is retained for migration compatibility. Signing is now
# Actions-only: private R2 intent/result/delivery state and a GitHub
# commit-status lease replace the previously deployed private Worker boundary.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cherri-alert-experiment.yml
      - .github/workflows/shortcut-sign-disabled.yml
      - daily-games-tracker/shortcut/cherri-migration/source/**
      - daily-games-tracker/shortcut/cherri-migration/build/upload-native-contract.json
      - daily-games-tracker/shortcut/cherri-migration/toolchain.lock.json
      - daily-games-tracker/shortcut/capture-safari.js
      - daily-games-tracker/scripts/phase5a*.py
      - daily-games-tracker/scripts/phase5a-*.mjs
      - daily-games-tracker/scripts/phase5a_actions_signing.mjs
      - daily-games-tracker/scripts/inspect_phase5*.py
      - daily-games-tracker/scripts/tests/test_phase5a*.py
      - daily-games-tracker/scripts/tests/phase5a*.test.mjs
      - daily-games-tracker/scripts/tests/fixtures/**
  workflow_dispatch:
    inputs:
      confirm_external_signing:
        description: Confirm the reviewed exact payload transfer to HubSign from protected Actions
        required: true
        type: boolean
        default: false
      confirm_ambiguous_recovery:
        description: Authorize one bounded recovery attempt for the existing ambiguous package
        required: true
        type: boolean
        default: false
      confirm_manual_resign:
        description: Authorize one fresh signing attempt with the unique request ID below
        required: true
        type: boolean
        default: false
      manual_resign_request_id:
        description: Unique lowercase UUIDv4 used once for this manual re-sign authorization
        required: false
        type: string
        default: ''
      manual_resign_source_commit:
        description: Full reviewed main commit; must exactly match this workflow's checked-out commit
        required: false
        type: string
        default: ''
      manual_resign_reason:
        description: Select the reviewed reason for this new signing request
        required: false
        type: choice
        options:
          - delivery-verification-failed
          - prior-signature-unavailable
          - previous-outcome-ambiguous
          - post-delivery-integrity-check-failed
      confirm_earlier_request_may_have_completed:
        description: Confirm that a previous HubSign request may have completed
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  statuses: write

# Serialize all protected signing attempts. The status lease below remains
# authoritative across reruns and source commits.
concurrency:
  group: full-upload-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_external_signing == true) }}
    runs-on: ubuntu-24.04
    environment: wht-shortcut-signing
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_API_URL: ${{ github.api_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WHT_RUNTIME_ORIGIN: ${{ secrets.WHT_RUNTIME_ORIGIN }}
      WHT_R2_ACCOUNT_ID: ${{ secrets.WHT_R2_ACCOUNT_ID }}
      WHT_R2_BUCKET_NAME: ${{ secrets.WHT_R2_BUCKET_NAME }}
      WHT_R2_ACCESS_KEY_ID: ${{ secrets.WHT_R2_ACCESS_KEY_ID }}
      WHT_R2_SECRET_ACCESS_KEY: ${{ secrets.WHT_R2_SECRET_ACCESS_KEY }}
      WHT_AMBIGUITY_RECORD_SHA256: ${{ secrets.WHT_AMBIGUITY_RECORD_SHA256 }}
      WHT_AMBIGUOUS_RECOVERY_AUTH: ${{ secrets.WHT_AMBIGUOUS_RECOVERY_AUTH }}
      WHT_AMBIGUOUS_RECOVERY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_ambiguous_recovery == true }}
      WHT_MANUAL_RESIGN_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_manual_resign == true }}
      WHT_MANUAL_RESIGN_REQUEST_ID: ${{ inputs.manual_resign_request_id }}
      WHT_MANUAL_RESIGN_SOURCE_COMMIT: ${{ inputs.manual_resign_source_commit }}
      WHT_MANUAL_RESIGN_REASON: ${{ inputs.manual_resign_reason }}
      WHT_CONFIRM_EARLIER_REQUEST_MAY_HAVE_COMPLETED: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_earlier_request_may_have_completed == true }}
      CHERRI_COMMIT: d2072c62ea708e7727099fab94fa28b0bcec747b
      PYTHONUTF8: "1"
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Require protected reviewed source and private R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$WHT_RUNTIME_ORIGIN"
          test -n "$WHT_R2_ACCOUNT_ID"
          test -n "$WHT_R2_BUCKET_NAME"
          test -n "$WHT_R2_ACCESS_KEY_ID"
          test -n "$WHT_R2_SECRET_ACCESS_KEY"
          [[ "$WHT_AMBIGUITY_RECORD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "::add-mask::$WHT_AMBIGUITY_RECORD_SHA256"
          if [[ "$WHT_AMBIGUOUS_RECOVERY_REQUESTED" == true ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_RUN_ATTEMPT" = 1
            test -n "$WHT_AMBIGUOUS_RECOVERY_AUTH"
          fi
          python3 - 2>/dev/null <<'PY'
          import os
          from urllib.parse import urlsplit
          origin = os.environ["WHT_RUNTIME_ORIGIN"]
          parsed = urlsplit(origin)
          assert origin == origin.strip() and not origin.endswith("/")
          assert parsed.scheme == "https" and parsed.hostname
          assert parsed.username is None and parsed.password is None
          assert parsed.path in ("", "/") and not parsed.query and not parsed.fragment
          host = parsed.hostname.lower().rstrip(".")
          assert host != "localhost" and not host.endswith((".invalid", ".example", ".test"))
          print("protected Actions R2 signing configuration shape passed")
          PY

      - name: Check out only the protected reviewed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify standing protected production authorization
        run: node daily-games-tracker/scripts/phase5a-approval-rehearsal.mjs --production

      - name: Validate optional manual re-sign authorization
        run: node daily-games-tracker/scripts/phase5a_actions_signing.mjs validate-manual-resign

      - name: Establish stable protected status anchor
        shell: bash
        run: |
          set -euo pipefail
          readarray -t roots < <(git rev-list --max-parents=0 HEAD)
          test "${#roots[@]}" -eq 1
          [[ "${roots[0]}" =~ ^[0-9a-f]{40}$ ]]
          echo "WHT_SIGNING_STATUS_ANCHOR=${roots[0]}" >> "$GITHUB_ENV"

      - name: Confirm checkout and locked unsigned build policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node daily-games-tracker/scripts/phase5a-verify-toolchain.mjs --lock daily-games-tracker/shortcut/cherri-migration/toolchain.lock.json --workflow .github/workflows/cherri-alert-experiment.yml

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"
          check-latest: false
          cache: false

      - name: Rebuild pinned compiler with verified module graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = go1.24.0
          source_dir="$RUNNER_TEMP/cherri-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/electrikmilk/cherri.git
          git -C "$source_dir" fetch --depth=1 origin "$CHERRI_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$CHERRI_COMMIT"
          export GOTOOLCHAIN=local
          export GOTELEMETRY=off
          go -C "$source_dir" mod download
          go -C "$source_dir" mod verify
          go -C "$source_dir" build -mod=readonly -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/cherri" .
          test -s "$RUNNER_TEMP/cherri"

      - name: Build, inspect, compare, and freeze the private package twice
        shell: bash
        run: |
          set -euo pipefail
          python3 daily-games-tracker/scripts/phase5a_build_upload.py --compiler "$RUNNER_TEMP/cherri" --runtime-origin "$WHT_RUNTIME_ORIGIN" --require-nonreserved-origin --output "$RUNNER_TEMP/upload-first" >/dev/null 2>&1
          python3 daily-games-tracker/scripts/phase5a_build_upload.py --compiler "$RUNNER_TEMP/cherri" --runtime-origin "$WHT_RUNTIME_ORIGIN" --require-nonreserved-origin --output "$RUNNER_TEMP/upload-second" >/dev/null 2>&1
          python3 daily-games-tracker/scripts/phase5a_compare_upload.py "$RUNNER_TEMP/upload-first/Upload To WHT_unsigned.shortcut" "$RUNNER_TEMP/upload-second/Upload To WHT_unsigned.shortcut" > "$RUNNER_TEMP/upload-first/reproducibility.json" 2>/dev/null
          python3 daily-games-tracker/scripts/phase5a_upload_signing.py prepare --build-directory "$RUNNER_TEMP/upload-first" --runtime-origin "$WHT_RUNTIME_ORIGIN" --output "$RUNNER_TEMP/upload-review-package" >/dev/null 2>&1

      - name: Validate the frozen package and compute private digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          readarray -t digests < <(python3 - "$RUNNER_TEMP/upload-review-package" 2>/dev/null <<'PY'
          import hashlib, pathlib, sys
          package = pathlib.Path(sys.argv[1])
          print(hashlib.sha256((package / "approval-manifest.json").read_bytes()).hexdigest())
          print(hashlib.sha256((package / "hubsign-request.json").read_bytes()).hexdigest())
          PY
          )
          manifest_sha256="${digests[0]}"
          wire_sha256="${digests[1]}"
          echo "::add-mask::$manifest_sha256"
          echo "::add-mask::$wire_sha256"
          python3 daily-games-tracker/scripts/phase5a_upload_signing.py validate \
            --package "$RUNNER_TEMP/upload-review-package" \
            --runtime-origin "$WHT_RUNTIME_ORIGIN" \
            --expected-manifest-sha256 "$manifest_sha256" \
            --expected-wire-sha256 "$wire_sha256" \
            > "$RUNNER_TEMP/package-validation.json" 2>/dev/null
          {
            echo "manifest_sha256=$manifest_sha256"
            echo "wire_sha256=$wire_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Persist private R2 intent before provider transfer
        env:
          MANIFEST_SHA256: ${{ steps.digests.outputs.manifest_sha256 }}
          WIRE_SHA256: ${{ steps.digests.outputs.wire_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          node daily-games-tracker/scripts/phase5a_actions_signing.mjs prepare \
            --package "$RUNNER_TEMP/upload-review-package" \
            --source-commit "$GITHUB_SHA" \
            --manifest-sha "$MANIFEST_SHA256" \
            --wire-sha "$WIRE_SHA256" >/dev/null 2>&1

      - name: Send exactly one direct HubSign request
        id: send
        env:
          MANIFEST_SHA256: ${{ steps.digests.outputs.manifest_sha256 }}
          WIRE_SHA256: ${{ steps.digests.outputs.wire_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          node daily-games-tracker/scripts/phase5a_actions_signing.mjs send \
            --package "$RUNNER_TEMP/upload-review-package" \
            --source-commit "$GITHUB_SHA" \
            --manifest-sha "$MANIFEST_SHA256" \
            --wire-sha "$WIRE_SHA256" \
            --signed-path "$RUNNER_TEMP/wht-signed.shortcut" >/dev/null 2>&1

      - name: Upload signed Shortcut and private latest manifest
        env:
          MANIFEST_SHA256: ${{ steps.digests.outputs.manifest_sha256 }}
          WIRE_SHA256: ${{ steps.digests.outputs.wire_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          node daily-games-tracker/scripts/phase5a_actions_signing.mjs publish \
            --package "$RUNNER_TEMP/upload-review-package" \
            --source-commit "$GITHUB_SHA" \
            --manifest-sha "$MANIFEST_SHA256" \
            --wire-sha "$WIRE_SHA256" \
            --signed-path "$RUNNER_TEMP/wht-signed.shortcut" >/dev/null 2>&1

      - name: Mark private R2 delivery complete
        env:
          MANIFEST_SHA256: ${{ steps.digests.outputs.manifest_sha256 }}
          WIRE_SHA256: ${{ steps.digests.outputs.wire_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          node daily-games-tracker/scripts/phase5a_actions_signing.mjs complete \
            --package "$RUNNER_TEMP/upload-review-package" \
            --source-commit "$GITHUB_SHA" \
            --manifest-sha "$MANIFEST_SHA256" \
            --wire-sha "$WIRE_SHA256" \
            --signed-path "$RUNNER_TEMP/wht-signed.shortcut" >/dev/null 2>&1
