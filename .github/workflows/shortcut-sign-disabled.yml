name: Full upload signing (protected automation)

# Protected-environment operation for reviewed main pushes, with manual
# recovery dispatch. It never runs for pull requests or uploads origin-bearing
# or signed payload artifacts.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cherri-alert-experiment.yml
      - .github/workflows/shortcut-sign-disabled.yml
      - daily-games-tracker/shortcut/cherri-migration/source/**
      - daily-games-tracker/shortcut/cherri-migration/build/upload-native-contract.json
      - daily-games-tracker/shortcut/cherri-migration/toolchain.lock.json
      - daily-games-tracker/shortcut/capture-safari.js
      - daily-games-tracker/scripts/phase5a*.py
      - daily-games-tracker/scripts/phase5a-*.mjs
      - daily-games-tracker/scripts/inspect_phase5*.py
      - daily-games-tracker/scripts/tests/test_phase5a*.py
      - daily-games-tracker/scripts/tests/phase5a*.test.mjs
      - daily-games-tracker/scripts/tests/fixtures/**
  workflow_dispatch:
    inputs:
      confirm_external_signing:
        description: Confirm the reviewed exact payload transfer to the private signing worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-upload-sign-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  sign:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_external_signing == true) }}
    runs-on: ubuntu-24.04
    environment: wht-shortcut-signing
    timeout-minutes: 30
    env:
      REVIEWED_APPLICATION_COMMIT: ${{ secrets.WHT_REVIEWED_APPLICATION_COMMIT }}
      WHT_RUNTIME_ORIGIN: ${{ secrets.WHT_RUNTIME_ORIGIN }}
      WHT_SIGNING_RECEIPT_URL: ${{ secrets.WHT_SIGNING_RECEIPT_URL }}
      WHT_SIGNING_RECEIPT_TOKEN: ${{ secrets.WHT_SIGNING_RECEIPT_TOKEN }}
      CHERRI_COMMIT: d2072c62ea708e7727099fab94fa28b0bcec747b
      PYTHONUTF8: "1"
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Require protected reviewed source and private delivery configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/main
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$REVIEWED_APPLICATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$REVIEWED_APPLICATION_COMMIT" != '0000000000000000000000000000000000000000'
            test "$REVIEWED_APPLICATION_COMMIT" = "$GITHUB_SHA"
          else
            false
          fi
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$WHT_RUNTIME_ORIGIN"
          test -n "$WHT_SIGNING_RECEIPT_URL"
          test -n "$WHT_SIGNING_RECEIPT_TOKEN"
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          origin = os.environ["WHT_RUNTIME_ORIGIN"]
          receipt = os.environ["WHT_SIGNING_RECEIPT_URL"]
          def https_origin(value):
              parsed = urlsplit(value)
              assert value == value.strip() and parsed.scheme == "https" and parsed.hostname
              assert parsed.username is None and parsed.password is None
              assert parsed.path in ("", "/") and not parsed.query and not parsed.fragment and not value.endswith("/")
          def https_endpoint(value):
              parsed = urlsplit(value)
              assert value == value.strip() and parsed.scheme == "https" and parsed.hostname
              assert parsed.username is None and parsed.password is None and not parsed.query and not parsed.fragment
          https_origin(origin)
          host = urlsplit(origin).hostname.lower().rstrip(".")
          assert host != "localhost" and not host.endswith((".invalid", ".example", ".test"))
          https_endpoint(receipt)
          print("protected signing configuration shape passed")
          PY

      - name: Check out only the protected reviewed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm checkout and locked unsigned build policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node daily-games-tracker/scripts/phase5a-verify-toolchain.mjs --lock daily-games-tracker/shortcut/cherri-migration/toolchain.lock.json --workflow .github/workflows/cherri-alert-experiment.yml

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"
          check-latest: false
          cache: false

      - name: Rebuild pinned compiler with verified module graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = go1.24.0
          source_dir="$RUNNER_TEMP/cherri-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/electrikmilk/cherri.git
          git -C "$source_dir" fetch --depth=1 origin "$CHERRI_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$CHERRI_COMMIT"
          export GOTOOLCHAIN=local
          export GOTELEMETRY=off
          go -C "$source_dir" mod download
          go -C "$source_dir" mod verify
          go -C "$source_dir" build -mod=readonly -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/cherri" .
          test -s "$RUNNER_TEMP/cherri"

      - name: Build, inspect, compare, and freeze the private package twice
        shell: bash
        run: |
          set -euo pipefail
          python3 daily-games-tracker/scripts/phase5a_build_upload.py --compiler "$RUNNER_TEMP/cherri" --runtime-origin "$WHT_RUNTIME_ORIGIN" --require-nonreserved-origin --output "$RUNNER_TEMP/upload-first"
          python3 daily-games-tracker/scripts/phase5a_build_upload.py --compiler "$RUNNER_TEMP/cherri" --runtime-origin "$WHT_RUNTIME_ORIGIN" --require-nonreserved-origin --output "$RUNNER_TEMP/upload-second"
          python3 daily-games-tracker/scripts/phase5a_compare_upload.py "$RUNNER_TEMP/upload-first/Upload To WHT_unsigned.shortcut" "$RUNNER_TEMP/upload-second/Upload To WHT_unsigned.shortcut" > "$RUNNER_TEMP/upload-first/reproducibility.json"
          python3 daily-games-tracker/scripts/phase5a_upload_signing.py prepare --build-directory "$RUNNER_TEMP/upload-first" --runtime-origin "$WHT_RUNTIME_ORIGIN" --output "$RUNNER_TEMP/upload-review-package"

      - name: Ask the durable private worker to sign the frozen package once
        shell: bash
        run: |
          set -euo pipefail
          readarray -t digests < <(PYTHONPATH=daily-games-tracker/scripts python3 - "$RUNNER_TEMP/upload-review-package" <<'PY'
          import hashlib, json, pathlib, sys
          package = pathlib.Path(sys.argv[1])
          manifest_bytes = (package / "approval-manifest.json").read_bytes()
          manifest = json.loads(manifest_bytes)
          print(hashlib.sha256(manifest_bytes).hexdigest())
          print(manifest["futureSigningPayload"]["jsonWireSha256"])
          PY
          )
          manifest_sha256="${digests[0]}"
          wire_sha256="${digests[1]}"
          test "$manifest_sha256" = "$(sha256sum "$RUNNER_TEMP/upload-review-package/approval-manifest.json" | awk '{print $1}')"
          PYTHONPATH=daily-games-tracker/scripts python3 daily-games-tracker/scripts/phase5a_private_receipt.py \
            --endpoint "$WHT_SIGNING_RECEIPT_URL" \
            sign \
            --source-commit "$GITHUB_SHA" \
            --runtime-origin "$WHT_RUNTIME_ORIGIN" \
            --package "$RUNNER_TEMP/upload-review-package" \
            --expected-manifest-sha256 "$manifest_sha256" \
            --expected-wire-sha256 "$wire_sha256" \
            > "$RUNNER_TEMP/private-signing-receipt.json"
          test -s "$RUNNER_TEMP/private-signing-receipt.json"

      - name: Recover signed Shortcut to private runner storage
        shell: bash
        run: |
          set -euo pipefail
          readarray -t receipt_fields < <(python3 - "$RUNNER_TEMP/private-signing-receipt.json" <<'PY'
          import json, pathlib, sys
          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(receipt["idempotencyKey"])
          print(receipt["signedShortcutSha256"])
          PY
          )
          idempotency_key="${receipt_fields[0]}"
          signed_sha256="${receipt_fields[1]}"
          signed_output="$RUNNER_TEMP/Upload To WHT_signed.shortcut"
          PYTHONPATH=daily-games-tracker/scripts python3 daily-games-tracker/scripts/phase5a_private_receipt.py \
            --endpoint "$WHT_SIGNING_RECEIPT_URL" \
            recover \
            --idempotency-key "$idempotency_key" \
            --expected-signed-sha256 "$signed_sha256" \
            --output "$signed_output" \
            > "$RUNNER_TEMP/private-signing-recovery.json"
          test -s "$signed_output"
          python3 - "$signed_output" "$signed_sha256" <<'PY'
          import hashlib, pathlib, sys
          signed = pathlib.Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(signed).hexdigest() == sys.argv[2]
          assert signed[:4] == b"AEA1"
          PY
