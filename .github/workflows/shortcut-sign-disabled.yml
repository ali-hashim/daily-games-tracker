name: Full upload signing (protected Actions automation)

# The filename is retained for migration compatibility. Signing is now
# Actions-only: encrypted intent/result artifacts and a GitHub commit-status
# lease replace the previously deployed private Worker boundary.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cherri-alert-experiment.yml
      - .github/workflows/shortcut-sign-disabled.yml
      - daily-games-tracker/shortcut/cherri-migration/source/**
      - daily-games-tracker/shortcut/cherri-migration/build/upload-native-contract.json
      - daily-games-tracker/shortcut/cherri-migration/toolchain.lock.json
      - daily-games-tracker/shortcut/capture-safari.js
      - daily-games-tracker/scripts/phase5a*.py
      - daily-games-tracker/scripts/phase5a-*.mjs
      - daily-games-tracker/scripts/phase5a_actions_signing.mjs
      - daily-games-tracker/scripts/inspect_phase5*.py
      - daily-games-tracker/scripts/tests/test_phase5a*.py
      - daily-games-tracker/scripts/tests/phase5a*.test.mjs
      - daily-games-tracker/scripts/tests/fixtures/**
  workflow_dispatch:
    inputs:
      confirm_external_signing:
        description: Confirm the reviewed exact payload transfer to HubSign from protected Actions
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

# Serialize all protected signing attempts. The status lease below remains
# authoritative across reruns and source commits.
concurrency:
  group: full-upload-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_external_signing == true) }}
    runs-on: ubuntu-24.04
    environment: wht-shortcut-signing
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_API_URL: ${{ github.api_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      REVIEWED_APPLICATION_COMMIT: ${{ secrets.WHT_REVIEWED_APPLICATION_COMMIT }}
      WHT_RUNTIME_ORIGIN: ${{ secrets.WHT_RUNTIME_ORIGIN }}
      WHT_SIGNING_OUTPUT_KEY: ${{ secrets.WHT_SIGNING_OUTPUT_KEY }}
      WHT_AMBIGUOUS_SIGNING_RECORD: ${{ secrets.WHT_AMBIGUOUS_SIGNING_RECORD }}
      CHERRI_COMMIT: d2072c62ea708e7727099fab94fa28b0bcec747b
      PYTHONUTF8: "1"
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Require protected reviewed source and private encryption configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_APPLICATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_APPLICATION_COMMIT" != '0000000000000000000000000000000000000000'
          test "$REVIEWED_APPLICATION_COMMIT" = "$GITHUB_SHA"
          test -n "$WHT_RUNTIME_ORIGIN"
          test -n "$WHT_SIGNING_OUTPUT_KEY"
          test -n "$WHT_AMBIGUOUS_SIGNING_RECORD"
          python3 - <<'PY'
          import base64, os
          from urllib.parse import urlsplit
          origin = os.environ["WHT_RUNTIME_ORIGIN"]
          parsed = urlsplit(origin)
          assert origin == origin.strip() and not origin.endswith("/")
          assert parsed.scheme == "https" and parsed.hostname
          assert parsed.username is None and parsed.password is None
          assert parsed.path in ("", "/") and not parsed.query and not parsed.fragment
          host = parsed.hostname.lower().rstrip(".")
          assert host != "localhost" and not host.endswith((".invalid", ".example", ".test"))
          key = os.environ["WHT_SIGNING_OUTPUT_KEY"]
          decoded = base64.b64decode(key, validate=True)
          assert base64.b64encode(decoded).decode("ascii") == key and len(decoded) == 32
          print("protected Actions signing configuration shape passed")
          PY

      - name: Check out only the protected reviewed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Establish stable protected status anchor
        shell: bash
        run: |
          set -euo pipefail
          readarray -t roots < <(git rev-list --max-parents=0 HEAD)
          test "${#roots[@]}" -eq 1
          [[ "${roots[0]}" =~ ^[0-9a-f]{40}$ ]]
          echo "WHT_SIGNING_STATUS_ANCHOR=${roots[0]}" >> "$GITHUB_ENV"

      - name: Confirm checkout and locked unsigned build policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node daily-games-tracker/scripts/phase5a-verify-toolchain.mjs --lock daily-games-tracker/shortcut/cherri-migration/toolchain.lock.json --workflow .github/workflows/cherri-alert-experiment.yml

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"
          check-latest: false
          cache: false

      - name: Rebuild pinned compiler with verified module graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = go1.24.0
          source_dir="$RUNNER_TEMP/cherri-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/electrikmilk/cherri.git
          git -C "$source_dir" fetch --depth=1 origin "$CHERRI_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$CHERRI_COMMIT"
          export GOTOOLCHAIN=local
          export GOTELEMETRY=off
          go -C "$source_dir" mod download
          go -C "$source_dir" mod verify
          go -C "$source_dir" build -mod=readonly -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/cherri" .
          test -s "$RUNNER_TEMP/cherri"

      - name: Build, inspect, compare, and freeze the private package twice
        shell: bash
        run: |
          set -euo pipefail
          python3 daily-games-tracker/scripts/phase5a_build_upload.py --compiler "$RUNNER_TEMP/cherri" --runtime-origin "$WHT_RUNTIME_ORIGIN" --require-nonreserved-origin --output "$RUNNER_TEMP/upload-first"
          python3 daily-games-tracker/scripts/phase5a_build_upload.py --compiler "$RUNNER_TEMP/cherri" --runtime-origin "$WHT_RUNTIME_ORIGIN" --require-nonreserved-origin --output "$RUNNER_TEMP/upload-second"
          python3 daily-games-tracker/scripts/phase5a_compare_upload.py "$RUNNER_TEMP/upload-first/Upload To WHT_unsigned.shortcut" "$RUNNER_TEMP/upload-second/Upload To WHT_unsigned.shortcut" > "$RUNNER_TEMP/upload-first/reproducibility.json"
          python3 daily-games-tracker/scripts/phase5a_upload_signing.py prepare --build-directory "$RUNNER_TEMP/upload-first" --runtime-origin "$WHT_RUNTIME_ORIGIN" --output "$RUNNER_TEMP/upload-review-package"

      - name: Validate the frozen package and compute private digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          readarray -t digests < <(python3 - "$RUNNER_TEMP/upload-review-package" <<'PY'
          import hashlib, pathlib, sys
          package = pathlib.Path(sys.argv[1])
          print(hashlib.sha256((package / "approval-manifest.json").read_bytes()).hexdigest())
          print(hashlib.sha256((package / "hubsign-request.json").read_bytes()).hexdigest())
          PY
          )
          manifest_sha256="${digests[0]}"
          wire_sha256="${digests[1]}"
          python3 daily-games-tracker/scripts/phase5a_upload_signing.py validate \
            --package "$RUNNER_TEMP/upload-review-package" \
            --runtime-origin "$WHT_RUNTIME_ORIGIN" \
            --expected-manifest-sha256 "$manifest_sha256" \
            --expected-wire-sha256 "$wire_sha256" \
            > "$RUNNER_TEMP/package-validation.json"
          {
            echo "manifest_sha256=$manifest_sha256"
            echo "wire_sha256=$wire_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Persist encrypted signing intent before provider transfer
        id: prepare
        env:
          MANIFEST_SHA256: ${{ steps.digests.outputs.manifest_sha256 }}
          WIRE_SHA256: ${{ steps.digests.outputs.wire_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          node daily-games-tracker/scripts/phase5a_actions_signing.mjs prepare \
            --package "$RUNNER_TEMP/upload-review-package" \
            --source-commit "$GITHUB_SHA" \
            --manifest-sha "$MANIFEST_SHA256" \
            --wire-sha "$WIRE_SHA256" \
            --intent-path "$RUNNER_TEMP/wht-signing-intent.enc"

      - name: Upload encrypted signing intent
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: ${{ steps.prepare.outputs.intent_artifact }}
          path: ${{ steps.prepare.outputs.intent_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Send exactly one direct HubSign request
        shell: bash
        run: |
          set -euo pipefail
          node daily-games-tracker/scripts/phase5a_actions_signing.mjs send \
            --package "$RUNNER_TEMP/upload-review-package" \
            --intent-path "$RUNNER_TEMP/wht-signing-intent.enc" \
            --result-path "$RUNNER_TEMP/wht-signing-result.enc"

      - name: Upload encrypted signed result
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: ${{ steps.prepare.outputs.result_artifact }}
          path: ${{ runner.temp }}/wht-signing-result.enc
          if-no-files-found: error
          retention-days: 90

      - name: Mark encrypted result complete
        shell: bash
        run: |
          set -euo pipefail
          node daily-games-tracker/scripts/phase5a_actions_signing.mjs complete \
            --result-path "$RUNNER_TEMP/wht-signing-result.enc"
