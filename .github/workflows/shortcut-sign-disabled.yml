name: Full upload signing (permanently disabled preparation)

# Canonical local signing preparation. No pull_request trigger and no PR inputs.
# Activation/export/dispatch require separate authorization. Standing HubSign
# approval does not authorize those operations. See PHASE5A_FULL_CLIENT_CI_SIGNING.md.
on:
  workflow_dispatch:
    inputs:
      trusted_application_commit:
        description: Exact reviewed sanitized source commit (40 lowercase hex)
        required: true
        type: string
      approved_manifest_sha256:
        description: Exact previously reviewed unsigned full-client package manifest
        required: true
        type: string
      approved_wire_sha256:
        description: Exact previously reviewed HubSign JSON wire payload
        required: true
        type: string
      confirm_external_signing:
        description: Confirm the reviewed exact payload transfer to HubSign
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: full-upload-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    # Permanent safety stop; preparation must never weaken this guard.
    if: ${{ false && inputs.confirm_external_signing }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # No clean reviewed source commit exists for this dirty local preparation.
      # A later separately authorized export review must pin it here. Fail closed.
      REVIEWED_APPLICATION_COMMIT: "0000000000000000000000000000000000000000"
      CHERRI_COMMIT: d2072c62ea708e7727099fab94fa28b0bcec747b
      PYTHONUTF8: "1"
      PYTHONOPTIMIZE: "0"
    steps:
      - name: Require the reviewed main-source identity before checkout
        shell: bash
        env:
          TRUSTED_APPLICATION_COMMIT: ${{ inputs.trusted_application_commit }}
          APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
          APPROVED_WIRE_SHA256: ${{ inputs.approved_wire_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TRUSTED_APPLICATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_APPLICATION_COMMIT" != '0000000000000000000000000000000000000000'
          test "$TRUSTED_APPLICATION_COMMIT" = "$REVIEWED_APPLICATION_COMMIT"
          [[ "$APPROVED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$APPROVED_WIRE_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out only the reviewed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.trusted_application_commit }}
          persist-credentials: false

      - name: Confirm checkout and locked unsigned build policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_APPLICATION_COMMIT"
          node daily-games-tracker/scripts/phase5a-verify-toolchain.mjs --lock daily-games-tracker/shortcut/cherri-migration/toolchain.lock.json --workflow .github/workflows/cherri-alert-experiment.yml

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.0"
          check-latest: false
          cache: false

      - name: Rebuild pinned compiler with verified module graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = go1.24.0
          source_dir="$RUNNER_TEMP/cherri-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/electrikmilk/cherri.git
          git -C "$source_dir" fetch --depth=1 origin "$CHERRI_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$CHERRI_COMMIT"
          export GOTOOLCHAIN=local
          export GOTELEMETRY=off
          go -C "$source_dir" mod download
          go -C "$source_dir" mod verify
          go -C "$source_dir" build -mod=readonly -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/cherri" .
          test -s "$RUNNER_TEMP/cherri"

      - name: Build inspect compare and freeze complete client offline
        shell: bash
        run: |
          set -euo pipefail
          python3 daily-games-tracker/scripts/phase5a_build_upload.py --compiler "$RUNNER_TEMP/cherri" --output "$RUNNER_TEMP/upload-first"
          python3 daily-games-tracker/scripts/phase5a_build_upload.py --compiler "$RUNNER_TEMP/cherri" --output "$RUNNER_TEMP/upload-second"
          python3 daily-games-tracker/scripts/phase5a_compare_upload.py "$RUNNER_TEMP/upload-first/Upload to WHT_unsigned.shortcut" "$RUNNER_TEMP/upload-second/Upload to WHT_unsigned.shortcut" > "$RUNNER_TEMP/upload-first/reproducibility.json"
          python3 daily-games-tracker/scripts/phase5a_upload_signing.py prepare --build-directory "$RUNNER_TEMP/upload-first" --output "$RUNNER_TEMP/upload-review-package"

      - name: Send only the exact reviewed full-client package once
        shell: bash
        env:
          APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
          APPROVED_WIRE_SHA256: ${{ inputs.approved_wire_sha256 }}
        run: |
          set -euo pipefail
          # send rechecks every package file, native contract, XML and wire hash
          # before any POST. Byte drift fails closed; never approve from this run.
          python3 daily-games-tracker/scripts/phase5a_upload_signing.py send \
            --package "$RUNNER_TEMP/upload-review-package" \
            --output "$RUNNER_TEMP/upload-signing-evidence" \
            --expected-manifest-sha256 "$APPROVED_MANIFEST_SHA256" \
            --expected-wire-sha256 "$APPROVED_WIRE_SHA256"

      - name: Retain request intent and response evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: full-upload-signing-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upload-signing-evidence/
          if-no-files-found: warn
          retention-days: 1

      - name: Require a nonempty signed candidate on success
        shell: bash
        run: test -s "$RUNNER_TEMP/upload-signing-evidence/Upload to WHT_signed.shortcut"
