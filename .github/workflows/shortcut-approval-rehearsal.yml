name: Signing approval rehearsal (no signing)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rehearse:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: wht-signing-approval-rehearsal
    timeout-minutes: 5
    steps:
      - name: Check out the run revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check approval evidence without signing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node daily-games-tracker/scripts/phase5a-approval-rehearsal.mjs
