name: Cherri alert experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cherri-alert-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-alert:
    name: Build harmless unsigned alert twice
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed repository source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.24.0
          cache: false

      - name: Build Cherri from its pinned source commit
        shell: bash
        env:
          CHERRI_COMMIT: d2072c62ea708e7727099fab94fa28b0bcec747b
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/cherri-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/electrikmilk/cherri.git
          git -C "$source_dir" fetch --depth=1 origin "$CHERRI_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$CHERRI_COMMIT"
          cd "$source_dir"
          export GOTOOLCHAIN=local
          go mod download
          go mod verify
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/cherri" .

      - name: Compile and inspect the alert twice
        shell: bash
        run: |
          set -euo pipefail
          source_file="$GITHUB_WORKSPACE/daily-games-tracker/shortcut/cherri-migration/source/01-alert.cherri"
          inspector="$GITHUB_WORKSPACE/daily-games-tracker/shortcut/cherri-migration/build/inspect-shortcut.py"
          work="$RUNNER_TEMP/alert-experiment"
          out="$RUNNER_TEMP/alert-output"
          mkdir -p "$out"
          for attempt in 1 2; do
            dir="$work-$attempt"
            mkdir -p "$dir"
            cp "$source_file" "$dir/01-alert.cherri"
            "$RUNNER_TEMP/cherri" "$dir/01-alert.cherri" --skip-sign --derive-uuids
            mapfile -t shortcuts < <(find "$dir" -maxdepth 1 -type f -name '*_unsigned.shortcut' -print)
            test "${#shortcuts[@]}" -eq 1
            python3 "$inspector" "${shortcuts[0]}" --experiment 01 > "$out/inspection-$attempt.json"
            if [[ "$attempt" == 1 ]]; then
              cp "${shortcuts[0]}" "$out/Cherri-alert-probe_unsigned.shortcut"
            else
              cmp "$out/Cherri-alert-probe_unsigned.shortcut" "${shortcuts[0]}"
            fi
          done
          sha256sum "$out/Cherri-alert-probe_unsigned.shortcut" > "$out/SHA256SUMS"
          python3 - "$out" "$GITHUB_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          artifact = out / "Cherri-alert-probe_unsigned.shortcut"
          data = artifact.read_bytes()
          manifest = {
              "applicationCommit": sys.argv[2],
              "compiler": "Cherri v2.3.0",
              "compilerCommit": "d2072c62ea708e7727099fab94fa28b0bcec747b",
              "goVersion": "1.24.0",
              "buildFlags": ["--skip-sign", "--derive-uuids"],
              "artifact": artifact.name,
              "artifactSha256": hashlib.sha256(data).hexdigest(),
              "reproducibility": "two clean unsigned builds byte-identical",
              "signing": "not performed",
              "nativeExecution": "not performed",
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload harmless unsigned sample and reports
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: cherri-alert-experiment
          path: ${{ runner.temp }}/alert-output/
          if-no-files-found: error
          retention-days: 1
