name: Application checks

on:
  pull_request:
    paths:
      - daily-games-tracker/**
      - .github/workflows/application-checks.yml
  push:
    branches: [main]
    paths:
      - daily-games-tracker/**
      - .github/workflows/application-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Test and build the application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daily-games-tracker
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: daily-games-tracker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Typecheck all TypeScript projects
        run: npm run typecheck

      - name: Verify migrations and schema
        run: npm run test:database

      - name: Build Pages output
        run: npm run build
